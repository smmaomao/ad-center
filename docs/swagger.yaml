definitions:
  api.AdClickData:
    properties:
      click_id:
        example: clk_7788992233
        type: string
      jump_url:
        example: https://landing.com?click_id=clk_7788992233
        type: string
    type: object
  api.AdClickRequest:
    properties:
      ad_app_id:
        example: app_10001
        type: string
      adjust_adid:
        example: adj_xyz_9988
        type: string
      bid_id:
        example: bid_20260908_0001
        type: string
      creative_id:
        example: cr_90002
        type: string
      timestamp:
        example: 1774213465
        type: integer
      user_id:
        example: user_abc_12345
        type: string
    type: object
  api.AdClickResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/api.AdClickData'
      msg:
        example: success
        type: string
    type: object
  api.AdImpressionRequest:
    properties:
      ad_app_id:
        example: app_10001
        type: string
      bid_id:
        example: bid_20260908_0001
        type: string
      creative_id:
        example: cr_90002
        type: string
      timestamp:
        example: 1774213460
        type: integer
    type: object
  api.AdListData:
    properties:
      ad_list:
        items:
          $ref: '#/definitions/api.AdListItem'
        type: array
      loopable:
        description: |-
          Loopable 整个广告列表是否允许在客户端缓存期内循环播放。
          后台若配置了 ad_loopable 总开关，则以开关为准（enabled 直接决定 true/false）；
          未配置时回退到按素材类型推导：当且仅当列表内所有素材均可循环（视频）时为 true，
          任一图片素材出现则为 false。
        example: true
        type: boolean
    type: object
  api.AdListItem:
    properties:
      ad_style:
        additionalProperties:
          type: integer
        description: AdStyle 广告样式 → 最小播放秒数映射（单条广告当前生效样式及其要求的最小播放时长，秒）。
        example:
          REWARDED_VIDEO: 30
        type: object
      bid_id:
        example: bid_20260908_0001
        type: string
      click_url:
        example: https://landing.com?click_id={CLICK_ID}
        type: string
      creative_id:
        example: cr_90002
        type: string
      height:
        example: 1920
        type: integer
      material_type:
        example: VIDEO
        type: string
      material_url:
        example: https://cdn.example.com/creatives/abc123.mp4
        type: string
      required_duration:
        description: |-
          RequiredDuration 客户端须满足的展示时长（秒），按样式取值：
          REWARDED_VIDEO=素材时长（看满才可上报 video-complete 发奖）；
          FEED=素材时长（客户端据此锁定列表滑动，满 N 秒后才可划走，图片素材兜底 3）；
          SPLASH=固定 3；其余样式为 0。
        example: 15
        type: integer
      target_scene:
        example:
        - APP_LAUNCH
        items:
          type: string
        type: array
      width:
        example: 1080
        type: integer
    type: object
  api.AdListRequest:
    properties:
      ad_app_id:
        example: app_10001
        type: string
      adjust_adid:
        example: adj_xyz_9988
        type: string
      count:
        example: 5
        type: integer
      ip:
        example: 192.168.1.100
        type: string
      os:
        example: ios
        type: string
      user_id:
        example: user_abc_12345
        type: string
    type: object
  api.AdListResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/api.AdListData'
      msg:
        example: success
        type: string
    type: object
  api.AdNonceResponse:
    properties:
      nonce:
        example: 1c71ba2a95b6c597574ab087fadf001f
        type: string
      ttl_seconds:
        example: 300
        type: integer
    type: object
  api.AdVideoCompleteRequest:
    properties:
      ad_app_id:
        example: app_10001
        type: string
      bid_id:
        example: bid_20260908_0001
        type: string
      creative_id:
        example: cr_90002
        type: string
      timestamp:
        example: 1774213495
        type: integer
      user_id:
        example: user_abc_12345
        type: string
    type: object
  api.AdVideoCompleteSignedRequest:
    properties:
      ad_app_id:
        example: app_10001
        type: string
      adjust_adid:
        example: adj_xyz_9988
        type: string
      nonce:
        example: 1c71ba2a95b6c597574ab087fadf001f
        type: string
      sign:
        description: Sign 对 (ad_app_id|user_id|adjust_adid|nonce) 做 HMAC-SHA256（密钥
          = 请求所用的 X-Api-Key，即 adc_...）得到的 hex 串。
        example: a3f1c0...hmac_sha256_hex
        type: string
      user_id:
        example: user_abc_12345
        type: string
    type: object
  api.AdVideoCompleteSignedResponse:
    properties:
      ad_app_id:
        example: app_10001
        type: string
      adjust_adid:
        example: adj_xyz_9988
        type: string
      user_id:
        example: user_abc_12345
        type: string
    type: object
  api.ClientSimpleResponse:
    properties:
      code:
        example: 200
        type: integer
      msg:
        example: success
        type: string
    type: object
info:
  contact: {}
  description: 客户端 SDK 对接用接口：批量获取广告、曝光/点击/完播埋点。所有接口通过 HTTP Header `X-Api-Key` 鉴权（值为后台分配的
    App API Key）。
  title: 广告投放中心 客户端接口
  version: "1.0"
paths:
  /v1/ad/click:
    post:
      consumes:
      - application/json
      description: 用户点击广告跳转前调用，换取 click_id（及 jump_url）拼进落地页；服务端按计费方式记一次有效点击。
      parameters:
      - description: App API Key
        in: header
        name: X-Api-Key
        required: true
        type: string
      - description: 点击埋点请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AdClickRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AdClickResponse'
      summary: 点击埋点
      tags:
      - 客户端接口
  /v1/ad/impression:
    post:
      consumes:
      - application/json
      description: 素材成功渲染并被用户看到时上报，触发 CPM 扣费与展现统计。
      parameters:
      - description: App API Key
        in: header
        name: X-Api-Key
        required: true
        type: string
      - description: 曝光埋点请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AdImpressionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ClientSimpleResponse'
      summary: 曝光埋点
      tags:
      - 客户端接口
  /v1/ad/list:
    post:
      consumes:
      - application/json
      description: 一次请求跨全部广告样式下发，按综合得分汇总取前 count 条；每条素材生成 bid_id（格式 bid_{日期}{时分秒}_{随机}，服务端缓存到
        Redis），供后续曝光/点击/完播埋点闭环归因。
      parameters:
      - description: App API Key
        in: header
        name: X-Api-Key
        required: true
        type: string
      - description: 批量获取广告请求（body 可空，参数亦可走 query）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AdListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AdListResponse'
      summary: 批量获取广告
      tags:
      - 客户端接口
  /v1/ad/nonce:
    post:
      consumes:
      - application/json
      description: 客户端在发起「看完广告」签名回调前先取一个一次性 nonce；nonce 用后即废（TTL 默认 5 分钟），不可复用或预生成后批量使用。
      parameters:
      - description: App API Key
        in: header
        name: X-Api-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AdNonceResponse'
      summary: 获取一次性 nonce（防重放）
      tags:
      - 客户端接口
  /v1/ad/video-complete:
    post:
      consumes:
      - application/json
      description: 仅 REWARDED_VIDEO 样式：观看达到 required_duration 秒或自然播完时上报，触发 S2S 回调发奖。
      parameters:
      - description: App API Key
        in: header
        name: X-Api-Key
        required: true
        type: string
      - description: 视频播放完毕请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AdVideoCompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ClientSimpleResponse'
      summary: 视频播放完毕
      tags:
      - 客户端接口
  /v1/ad/video-complete-signed:
    post:
      consumes:
      - application/json
      description: 在 /v1/ad/nonce 取 nonce 后，对 (ad_app_id|user_id|adjust_adid|nonce)
        做 HMAC-SHA256（密钥 = 请求所用的 X-Api-Key，即 adc_...）得 sign 再回调；服务端依次校验 ad_app_id
        一致 → 签名恒定时间比对 → nonce 单次有效，全过才发奖并原样回带三个字段。签名错→401，nonce 无效/已用/过期→400，ad_app_id
        不符→400。
      parameters:
      - description: App API Key
        in: header
        name: X-Api-Key
        required: true
        type: string
      - description: 带签名完播回调请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AdVideoCompleteSignedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AdVideoCompleteSignedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ClientSimpleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ClientSimpleResponse'
      summary: 视频播放完毕（防重放签名版，推荐）
      tags:
      - 客户端接口
schemes:
- https
- http
swagger: "2.0"
