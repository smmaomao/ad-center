app = "ad-center"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # 应用读取 PORT 监听；fly 会自动把 PORT 设为 internal_port
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
