# fly.toml app configuration file generated for ad-center on 2026-09-15T10:35:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ad-center-prod'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  # 应用健康检查在 /healthz（internal/api/router.go），必须显式指定；
  # 默认探活路径是 /，而路由表里没有 /，会导致 fly 误判机器不健康、返回 502。
  [http_service.health_checks]
    path = "/healthz"
    method = "get"
    interval = "60s"
    timeout = "2s"
    grace_period = "10s"
    headers = {}

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
